name = "propmaster"
main = "worker.js"
compatibility_date = "2026-06-01"

# Static build output, served via the ASSETS binding. Files that exist are
# served directly (headers from dist/_headers); worker.js only runs for
# paths that are not files and handles the SPA fallbacks for the two entry
# points (/ landing page, /app React app). See worker.js for why there is
# no _redirects file.
[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[observability]
enabled = true
